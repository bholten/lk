name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      sdl:
        description: "Also build SDL3 from source and run the offscreen example smoke + Tour snapshots"
        type: boolean
        default: false
      wasm-sdl:
        description: "Also build SDL3 for Emscripten and link lcl_lk_main.wasm"
        type: boolean
        default: false

jobs:
  core:
    # C89 core + Lcl bindings, headless.  The lcl pin is fetched by
    # CMake (FetchContent), so this needs nothing from apt.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lcl: [ON, OFF]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DLK_BUILD_LCL=${{ matrix.lcl }}
      - name: Build
        run: cmake --build build -j
      - name: Core tests
        run: build/lk_test
      - name: Lcl binding tests + doctests
        if: matrix.lcl == 'ON'
        run: build/lcl_lk_test
      - name: Install into a prefix (exercise the CMake package)
        run: |
          cmake --install build --prefix "$PWD/prefix"
          test -f prefix/include/lk.h
          test -f prefix/lib/cmake/lk/lkConfig.cmake

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASAN + UBSAN)
        run: >
          cmake -B build-asan -DLK_BUILD_LCL=ON -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan -j
      - name: Core tests
        run: build-asan/lk_test
      - name: Lcl tests (LeakSanitizer on, no suppressions)
        run: build-asan/lcl_lk_test

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure + build with clang-tidy (C89 targets)
        run: |
          cmake -B build-tidy -DLK_BUILD_LCL=ON -DLK_ENABLE_CLANG_TIDY=ON
          cmake --build build-tidy -j

  format:
    # Whole-tree clang-format check (the `format-check` target).  The
    # tree was formatted in one commit (ec8b195); this keeps it so.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Configure (no Lcl fetch needed)
        run: cmake -B build-fmt -DLK_BUILD_LCL=OFF
      - name: format-check
        run: cmake --build build-fmt --target format-check

  wasm:
    # Emscripten build of the core, the Lcl bindings and both test
    # programs, run under node.  No SDL: that is what makes it cheap
    # enough for every push, and it is the real check that nothing
    # depends on a 64-bit `long` (wasm32 has none).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.69
      - name: Configure
        run: emcmake cmake -S . -B build-emcc -DCMAKE_BUILD_TYPE=Release -DLK_BUILD_LCL=ON
      - name: Build
        run: cmake --build build-emcc -j
      - name: Core tests (node)
        run: node build-emcc/lk_test.js
      - name: Lcl binding tests + doctests (node)
        run: node --stack-size=8000 build-emcc/lcl_lk_test.js

  wasm-sdl:
    # Optional (manual dispatch): SDL3 + SDL3_ttf for Emscripten via
    # tools/emcc-deps.sh, then the full link including lcl_lk_main.wasm.
    if: github.event_name == 'workflow_dispatch' && inputs.wasm-sdl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.69
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Cache wasm SDL prefix
        id: wasm-sdl-cache
        uses: actions/cache@v4
        with:
          path: build-emcc/sdl-prefix
          key: wasm-sdl-release-3.2.20-ttf-3.2.2-emsdk-3.1.69
      - name: Build SDL3 + SDL3_ttf for Emscripten
        if: steps.wasm-sdl-cache.outputs.cache-hit != 'true'
        run: tools/emcc-deps.sh
      - name: Configure + build
        run: |
          emcmake cmake -S . -B build-emcc -DCMAKE_BUILD_TYPE=Release -DLK_BUILD_LCL=ON \
            -DCMAKE_PREFIX_PATH="$PWD/build-emcc/sdl-prefix" \
            -DCMAKE_FIND_ROOT_PATH="$PWD/build-emcc/sdl-prefix"
          cmake --build build-emcc -j
          test -f build-emcc/lcl_lk_main.wasm
      - name: Tests (node, SDL linked)
        run: node build-emcc/lk_test.js && node --stack-size=8000 build-emcc/lcl_lk_test.js

  sdl:
    # Optional (manual dispatch): builds SDL3 / SDL3_ttf / SDL3_image
    # from source, then runs every example headless under the offscreen
    # video driver and uploads the Widget Tour's page snapshots as an
    # artifact -- the visual regression net (docs/release.md).
    if: github.event_name == 'workflow_dispatch' && inputs.sdl
    runs-on: ubuntu-latest
    env:
      SDL_TAG: release-3.2.20
      SDL_TTF_TAG: release-3.2.2
      SDL_IMAGE_TAG: release-3.2.4
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies (SDL_ttf needs FreeType)
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build
          libfreetype-dev libx11-dev libxext-dev libwayland-dev
          libxkbcommon-dev libegl1-mesa-dev fonts-liberation
      - name: Cache SDL prefix
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: sdl-prefix
          key: sdl-${{ env.SDL_TAG }}-${{ env.SDL_TTF_TAG }}-${{ env.SDL_IMAGE_TAG }}-${{ runner.os }}
      - name: Build SDL3 from source
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          P="$PWD/sdl-prefix"
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git sdl
          cmake -S sdl -B sdl/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$P"
          cmake --build sdl/build && cmake --install sdl/build
          git clone --depth 1 --branch "$SDL_TTF_TAG" https://github.com/libsdl-org/SDL_ttf.git sdl_ttf
          cmake -S sdl_ttf -B sdl_ttf/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$P" -DCMAKE_INSTALL_PREFIX="$P" -DSDLTTF_VENDORED=OFF
          cmake --build sdl_ttf/build && cmake --install sdl_ttf/build
          git clone --depth 1 --branch "$SDL_IMAGE_TAG" https://github.com/libsdl-org/SDL_image.git sdl_image
          cmake -S sdl_image -B sdl_image/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$P" -DCMAKE_INSTALL_PREFIX="$P" -DSDLIMAGE_VENDORED=OFF -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_JXL=OFF -DSDLIMAGE_TIF=OFF -DSDLIMAGE_WEBP=OFF
          cmake --build sdl_image/build && cmake --install sdl_image/build
      - name: Configure + build lk with SDL
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLK_BUILD_LCL=ON -DCMAKE_PREFIX_PATH="$PWD/sdl-prefix"
          cmake --build build -j
      - name: Tests
        run: build/lk_test && build/lcl_lk_test
      - name: Example smoke + Tour snapshots (offscreen)
        run: LD_LIBRARY_PATH="$PWD/sdl-prefix/lib" tools/smoke.sh build "$PWD/tour"
      - uses: actions/upload-artifact@v4
        with:
          name: widget-tour-snapshots
          path: tour/*.png
